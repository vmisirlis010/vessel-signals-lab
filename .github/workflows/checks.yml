name: Offline checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile Python sources without cloud dependencies
        run: python -m compileall -q fabric_lab.py fabric_runtime.py connector_core.py consumer.py lab_notebooks.py notebook_sources tests
      - name: Run offline unit tests
        run: python -B -m unittest discover -s tests -v
      - name: Check the write-free default plan
        run: python -B fabric_lab.py plan
      - name: Parse optional Windows certificate wrapper without executing it
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'Invoke-CertificateConsumer.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count) {
            $errors | Format-List
            exit 1
          }
