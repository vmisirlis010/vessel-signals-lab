234.0 L 459.0,-234.0" style="stroke:#087F8C;fill:none;stroke-width:1.8;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 466.0 -234.0 L 459.0 -231.3 L 459.0 -236.7 Z" style="stroke:#087F8C;fill:#087f8c;stroke-linecap:butt;stroke-linejoin:miter;" /><path d="M 563.4,-201.6 L 563.4,-174.6" style="stroke:#087F8C;fill:none;stroke-width:1.8;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 563.4 -167.6 L 560.6999999999999 -174.6 L 566.1 -174.6 Z" style="stroke:#087F8C;fill:#087f8c;stroke-linecap:butt;stroke-linejoin:miter;" /><path d="M 468.0,-133.20000000000002 L 426.59999999999997,-133.20000000000002" style="stroke:#087F8C;fill:none;stroke-width:1.8;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 419.59999999999997 -133.20000000000002 L 426.59999999999997 -135.9 L 426.59999999999997 -130.50000000000003 Z" style="stroke:#087F8C;fill:#087f8c;stroke-linecap:butt;stroke-linejoin:miter;" /><text x="334.8" y="-341.40000000000003" dominant-baseline="central" fill="#16324F" font-size="21" font-family="Segoe UI" text-anchor="middle"><tspan x="334.8" dy="21">IDENTITY AND DATA ACCESS | two distinct consumers</tspan></text><text x="100.80000000000001" y="-258.0" dominant-baseline="central" fill="#7561A8" font-size="12.0" font-family="Segoe UI" text-anchor="middle"><tspan x="100.80000000000001" dy="12.0">Windows user certificate store</tspan><tspan x="100.80000000000001" dy="12.0">Non-exportable private key</tspan><tspan x="100.80000000000001" dy="12.0">Signs an OAuth client assertion</tspan></text><text x="327.59999999999997" y="-259.0" dominant-baseline="central" fill="#087F8C" font-size="12.5" font-family="Segoe UI" text-anchor="middle"><tspan x="327.59999999999997" dy="12.5">Microsoft Entra ID</tspan><tspan x="327.59999999999997" dy="12.5">Analytics Beta application</tspan><tspan x="327.59999999999997" dy="12.5">Issues app-only access token</tspan></text><text x="563.4" y="-263.0" dominant-baseline="central" fill="#087F8C" font-size="14.5" font-family="Segoe UI" text-anchor="middle"><tspan x="563.4" dy="14.5">Fabric GraphQL API</tspan><tspan x="563.4" dy="14.5">Validates token + Execute</tspan><tspan x="563.4" dy="14.5">No Mutation schema</tspan></text><text x="563.4" y="-163.2" dominant-baseline="central" fill="#087F8C" font-size="15.0" font-family="Segoe UI" text-anchor="middle"><tspan x="563.4" dy="15.0">Export SQL endpoint</tspan><tspan x="563.4" dy="15.0">Consumer ReadData</tspan><tspan x="563.4" dy="15.0">SSO caller identity</tspan></text><text x="327.59999999999997" y="-163.2" dominant-baseline="central" fill="#087F8C" font-size="15.0" font-family="Segoe UI" text-anchor="middle"><tspan x="327.59999999999997" dy="15.0">Approved dataset only</tspan><tspan x="327.59999999999997" dy="15.0">ALPHA-001..004</tspan><tspan x="327.59999999999997" dy="15.0">T01..T15</tspan></text><text x="100.80000000000001" y="-163.2" dominant-baseline="central" fill="#B55236" font-size="15.0" font-family="Segoe UI" text-anchor="middle"><tspan x="100.80000000000001" dy="15.0">Provider source</tspan><tspan x="100.80000000000001" dy="15.0">No consumer permission</tspan><tspan x="100.80000000000001" dy="15.0">No workspace role</tspan></text><text x="100.8" y="-89.39999999999999" dominant-baseline="central" fill="#B55236" font-size="12" font-family="Segoe UI" text-anchor="middle"><tspan x="100.8" dy="12">NOT a filter supplied by the caller</tspan></text><text x="333.0" y="-49.2" dominant-baseline="central" fill="#66758A" font-size="12.0" font-family="Segoe UI" text-anchor="middle"><tspan x="333.0" dy="12.0">Cloud notebook is a different identity path: notebook execution identity -&gt; same GraphQL API.</tspan><tspan x="333.0" dy="12.0">It demonstrates API retrieval; it does not prove service-principal isolation by itself.</tspan><tspan x="333.0" dy="12.0">All lab artifacts share one workspace. Separate provider/consumer workspaces are a production design choice.</tspan></text></svg>