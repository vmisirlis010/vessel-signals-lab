="79.19999999999999" dy="11.5">Shore-side measurements</tspan><tspan x="79.19999999999999" dy="11.5">Reliable change tracking</tspan></text><text x="266.40000000000003" y="-253.29999999999998" dominant-baseline="central" fill="#66758A" font-size="11.0" font-family="Segoe UI" text-anchor="middle"><tspan x="266.40000000000003" dy="11.0">Gateway + pipeline</tspan><tspan x="266.40000000000003" dy="11.0">Indexed incremental read</tspan><tspan x="266.40000000000003" dy="11.0">Late data + corrections</tspan></text><text x="450.0" y="-251.29999999999998" dominant-baseline="central" fill="#087F8C" font-size="10.0" font-family="Segoe UI" text-anchor="middle"><tspan x="450.0" dy="10.0">Curated publication</tspan><tspan x="450.0" dy="10.0">Versioned/immutable batch</tspan><tspan x="450.0" dy="10.0">Explicit completion marker</tspan></text><text x="635.4" y="-255.29999999999998" dominant-baseline="central" fill="#087F8C" font-size="12.0" font-family="Segoe UI" text-anchor="middle"><tspan x="635.4" dy="12.0">Fabric GraphQL</tspan><tspan x="635.4" dy="12.0">Read-only endpoint</tspan><tspan x="635.4" dy="12.0">Scoped partner identity</tspan></text><text x="635.4" y="-153.8" dominant-baseline="central" fill="#B57B1B" font-size="13.0" font-family="Segoe UI" text-anchor="middle"><tspan x="635.4" dy="13.0">API Management</tspan><tspan x="635.4" dy="13.0">Partner JWT validation</tspan><tspan x="635.4" dy="13.0">Limits / logs / versions</tspan></text><text x="415.8" y="-156.8" dominant-baseline="central" fill="#087F8C" font-size="14.5" font-family="Segoe UI" text-anchor="middle"><tspan x="415.8" dy="14.5">Partner integration job</tspan><tspan x="415.8" dy="14.5">Pull + retry + deduplicate</tspan><tspan x="415.8" dy="14.5">Store data and checkpoint</tspan></text><text x="133.2" y="-151.8" dominant-baseline="central" fill="#7561A8" font-size="12.0" font-family="Segoe UI" text-anchor="middle"><tspan x="133.2" dy="12.0">Partner-owned database or lake</tspan><tspan x="133.2" dy="12.0">Recipient chooses its own platform</tspan><tspan x="133.2" dy="12.0">No Fabric licence needed just to call HTTPS</tspan></text><text x="360.0" y="-67.5" dominant-baseline="central" fill="#16324F" font-size="15" font-family="Segoe UI" text-anchor="middle"><tspan x="360.0" dy="15">Partner -&gt; APIM token is validated before APIM exchanges to its managed-identity backend token.</tspan><tspan x="360.0" dy="15">A shared backend identity does NOT automatically preserve per-partner row entitlements.</tspan></text><text x="360.0" y="-16.6" dominant-baseline="central" fill="#66758A" font-size="13" font-family="Segoe UI" text-anchor="middle"><tspan x="360.0" dy="13">Separate workspaces / stable publication batches / key rotation / monitoring / deletion policy / recovery runbooks</tspan></text></svg>